<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>งานของฉัน</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f3f7fb;color:#17324d}.top{background:#0c3f70;color:#fff;padding:18px 20px}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #2342  }.input,textarea{width:100%;padding:12px;border:1px solid #ccd9e5;border-radius:10px;margin:6px 0;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#1268a8;color:#fff;font-weight:700}.muted{color:#687b8d}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef6ff}.miss{background:#fff2f0;color:#b42318}.ok{background:#edf9f0;color:#18733a}.score{font-size:26px;font-weight:800}.work h3{margin:0 0 6px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hide{display:none}</style></head><body><div class="top"><b>📚 งานของฉัน</b><div style="font-size:13px;opacity:.8">ระบบส่งงานนักเรียน</div></div><main class="wrap"><section class="card" id="login"><h2>เข้าสู่ห้องเรียน</h2><input id="sid" class="input" placeholder="รหัสนักเรียน / เลขประจำตัว"><button id="go">ดูงานของฉัน</button><p class="muted">หน้านี้สำหรับนักเรียนเท่านั้น ไม่แสดงเครื่องมือของครู</p></section><div id="app"></div></main><script>
const API='https://script.google.com/macros/s/AKfycbxunyrg12A_Fv4fM-6GZZ4rVXz07-EN_rRGsTbBQZmsLcjFnLeLgNX3t-vyHH8d7Xfqgw/exec',C=new URLSearchParams(location.search).get('class')||'', $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function jp(action,p={}){return new Promise((r,j)=>{let cb='sw'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');window[cb]=x=>{delete window[cb];s.remove();r(x)};s.onerror=j;s.src=API+'?'+new URLSearchParams({action,...p,callback:cb});document.head.appendChild(s)})}async function post(b){await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)})}async function load(){let id=$('sid').value.trim();if(!C||!id)return alert('กรอกรหัสนักเรียน');let r=await jp('getStudentWork',{classId:C,studentId:id});if(!r.ok)return alert('ไม่พบรายชื่อในห้องนี้');localStorage.swid=id;$('login').classList.add('hide');let subs=Object.fromEntries((r.submissions||[]).map(x=>[x.workId,x]));$('app').innerHTML=`<section class="card"><div class="muted">${esc(r.classInfo.className)} • ${esc(r.classInfo.subject)}</div><h2>${esc(r.student.studentName)}</h2><div class="score">${r.student.total} / ${r.student.max}</div><div class="muted">ขาด ${r.student.missing.length} งาน</div></section>`+r.works.map(w=>{let i=r.student.items.find(x=>x.workId===w.workId),sub=subs[w.workId];if(w.type==='exam')return `<section class="card work"><h3>${esc(w.title)}</h3><div class="row"><span class="tag ${i.status==='ขาด'?'miss':'ok'}">${esc(i.status)}</span><b>${i.score==null?'—':i.score} / ${w.maxScore}</b></div>${w.examId?`<p><a href="./student-exam.html?exam=${encodeURIComponent(w.examId)}">เปิดข้อสอบ →</a></p>`:''}</section>`;return `<section class="card work"><h3>${esc(w.title)}</h3><div class="row"><span class="tag ${sub?'ok':'miss'}">${sub?'ส่งแล้ว':'ยังไม่ส่ง'}</span><b>${i.score==null?'ยังไม่ตรวจ':i.score+' / '+w.maxScore}</b></div>${w.dueAt?`<p class="muted">กำหนดส่ง ${esc(w.dueAt)}</p>`:''}<textarea id="t_${w.workId}" class="input" placeholder="ข้อความ/รายละเอียดงาน">${esc(sub?.answerText||'')}</textarea><input id="u_${w.workId}" class="input" placeholder="ลิงก์งาน เช่น Google Drive" value="${esc(sub?.answerUrl||'')}"><button onclick="send('${w.workId}')">ส่งงาน</button>${sub?.feedback?`<p><b>ความคิดเห็นครู:</b> ${esc(sub.feedback)}</p>`:''}</section>`}).join('')}async function send(w){let r=await jp('getStudentWork',{classId:C,studentId:localStorage.swid});await post({action:'submitWork',workId:w,classId:C,studentId:localStorage.swid,studentName:r.student.studentName,answerText:$('t_'+w).value,answerUrl:$('u_'+w).value});alert('ส่งงานแล้ว');setTimeout(load,900)}$('go').onclick=load;$('sid').value=localStorage.swid||'';
</script></body></html>
