<body>
  <header class="appbar"><div class="brand"><div class="brandmark"></div><span>ระบบงานครูอาชีวศึกษา</span></div><div class="actions"><button class="btn btn-light" id="resetBtn">↻ <span class="label">ล้างข้อมูล</span></button><button class="btn btn-light" id="printBtn">⌁ <span class="label">พิมพ์</span></button><button class="btn btn-light" id="openPdfBtn">▣ <span class="label">เปิด PDF</span></button><button class="btn btn-primary" id="downloadPdfBtn">↓ <span class="label">บันทึก PDF</span></button></div></header>
  <main class="workspace">
    <aside class="panel form-panel">
      <h2 class="section-title"><span>1</span>ข้อมูลสถานศึกษา</h2>
      <div class="field"><label for="school">ชื่อสถานศึกษา</label><input id="school" value="วิทยาลัยเทคนิคปากช่อง"></div>
      <div class="field"><label for="department">แผนกวิชา</label><input id="department" value="ช่างไฟฟ้ากำลัง"></div>
      <div class="divider"></div>
      <h2 class="section-title"><span>2</span>ข้อมูลรายวิชา</h2>
      <div class="grid2"><div class="field"><label for="level">ระดับชั้น</label><select id="level"><option>ปวช.</option><option>ปวส.</option></select></div><div class="field"><label for="year">ชั้นปี</label><select id="year"><option>1</option><option>2</option><option>3</option></select></div></div>
      <div class="field"><label for="subject">ชื่อวิชา</label><input id="subject" value="วงจรไฟฟ้ากระแสตรง"></div>
      <div class="field"><label for="code">รหัสวิชา</label><input id="code" value="20104-2002"></div>
      <div class="field"><label for="topic">หน่วย / หัวข้อที่สอน</label><textarea id="topic">กฎของโอห์มและการคำนวณวงจรไฟฟ้า</textarea></div>
      <div class="divider"></div>
      <h2 class="section-title"><span>3</span>รูปแบบใบงาน</h2>
      <div class="field"><label for="docKind">ประเภทเอกสาร</label><select id="docKind"><option>ใบงาน</option><option>แบบทดสอบเก็บคะแนน</option><option>ข้อสอบกลางภาค</option><option>ข้อสอบปลายภาค</option></select></div>
      <div class="field"><label for="customTitle">ชื่อเอกสาร <span style="font-weight:400;color:#718392">(ไม่กรอกจะตั้งชื่อให้อัตโนมัติ)</span></label><input id="customTitle" placeholder="เช่น ใบงานหน่วยที่ 2 การวิเคราะห์วงจร"></div>
      <div class="field"><label for="type">รูปแบบคำถาม</label><select id="type"><option>ถาม–ตอบ</option><option>เติมคำ</option><option selected>ปรนัย 4 ตัวเลือก ก ข ค ง</option><option>คำนวณ</option><option value="วิเคราะห์" hidden>วิเคราะห์</option><option>ใบงานปฏิบัติ</option><option>แบบผสม</option><option>มายแมป</option><option>จับคู่ภาพกับชื่อหรือเนื้อหา</option></select></div>
      <div class="grid2"><div class="field"><label for="count">จำนวนข้อ <span style="font-weight:400;color:#718392">(สูงสุด 60)</span></label><input id="count" type="number" min="1" max="60" value="10"></div><div class="field"><label for="difficulty">ระดับความยาก</label><select id="difficulty"><option>ง่าย</option><option selected>ปานกลาง</option><option>ยาก</option></select></div></div>
      <div class="research-box external-source-box">
        <div class="research-title"><b>แหล่งข้อมูลภายนอก</b><span class="ai-pill">อ้างอิงเพิ่มเติม</span></div>
        <p class="source-status">ระบบจะไม่ตัดหรือดึงข้อความจากเว็บไซต์อัตโนมัติแล้ว หากต้องการค้นข้อมูลเพิ่มเติมให้เปิด Google แล้วนำสาระที่ตรวจสอบแล้วกลับมาใช้กับ AI หรือเพิ่มโจทย์เอง</p>
        <div class="search-row"><input id="externalSearchQuery" aria-label="ค้นเว็บ" placeholder="คำค้น เช่น FutureLog Supplier"><button class="mini-btn secondary" id="externalGoogleBtn" type="button">เปิด Google</button></div>
      </div>
      <div id="legacyResearchHidden" style="display:none!important">
        <input id="researchQuery"><button id="researchBtn" type="button"></button>
        <div id="topicBasket"></div><div id="contentCount"></div><p id="researchStatus"></p>
        <div id="sourceList"></div><div id="imageList"></div>
        <input id="manualSourceTitle"><input id="manualSourceUrl"><textarea id="manualSourceText"></textarea>
        <button id="webSearchBtn" type="button"></button><button id="addManualSourceBtn" type="button"></button>
        <input type="file" id="imageUpload" accept="image/*">
        <button id="aiGenerateBtn" type="button"></button>
      </div>
      <button class="btn generate" id="generateBtn">สร้าง/อัปเดตใบงาน</button>
    </aside>
    <section class="preview-wrap">
      <div class="preview-head"><h2>ตัวอย่างเอกสาร A4</h2><div class="tabs"><button class="tab active" data-view="student">ใบงานนักเรียน</button><button class="tab" data-view="teacher">เฉลยสำหรับครู</button></div></div>
      <div class="paper-stage"><article class="paper" id="paper"></article></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id); const fields=['school','department','level','year','subject','code','topic','type','count','difficulty'];
    const presets={
'มายแมป':{instruction:'เติมแผนผังความคิด',objectives:['เชื่อมโยงความรู้ตามหัวข้อได้']},
'จับคู่ภาพกับชื่อหรือเนื้อหา':{instruction:'จับคู่ภาพกับคำตอบ',objectives:['จำแนกภาพและความหมายได้']},
      'ปรนัย 4 ตัวเลือก ก ข ค ง':{instruction:'เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว แล้วทำเครื่องหมายลงในกระดาษคำตอบ',objectives:['อธิบายความสัมพันธ์ระหว่างแรงดันไฟฟ้า กระแสไฟฟ้า และความต้านทานได้','เลือกใช้กฎของโอห์มในการแก้ปัญหาวงจรไฟฟ้าได้']},
      'ถาม–ตอบ':{instruction:'ตอบคำถามต่อไปนี้ให้ได้ใจความถูกต้องและกระชับ โดยเขียนคำตอบหลังคำว่า “ตอบ:”',objectives:['อธิบายหลักการสำคัญของหัวข้อที่กำหนดได้','สื่อสารคำตอบโดยใช้ศัพท์ทางวิชาชีพได้ถูกต้อง']},
      'เติมคำ':{instruction:'เติมคำหรือข้อความที่เหมาะสมลงในช่องว่างที่กำหนดด้วยจุด',objectives:['ระบุคำศัพท์และสาระสำคัญของหัวข้อได้']},
      'คำนวณ':{instruction:'แสดงวิธีทำ สูตร การแทนค่า และหน่วยของคำตอบให้ครบถ้วน',objectives:['เลือกสูตรที่สัมพันธ์กับโจทย์ได้','คำนวณและตรวจสอบความสมเหตุสมผลของคำตอบได้']},
      'วิเคราะห์':{instruction:'วิเคราะห์สถานการณ์ พร้อมอธิบายเหตุผลประกอบคำตอบอย่างเป็นลำดับ',objectives:['จำแนกข้อมูลสำคัญจากสถานการณ์ได้','เชื่อมโยงหลักการเพื่อเสนอแนวทางแก้ปัญหาได้']},
      'ใบงานปฏิบัติ':{instruction:'ปฏิบัติงานตามลำดับขั้นโดยคำนึงถึงความปลอดภัย และบันทึกผลลงในช่องว่างที่กำหนดด้วยจุด',objectives:['เตรียมเครื่องมือและปฏิบัติงานตามขั้นตอนได้','ตรวจสอบผลและสรุปผลการปฏิบัติงานได้']},
      'แบบผสม':{instruction:'ทำแบบฝึกหัดทุกส่วนตามคำสั่งของแต่ละข้อ พร้อมแสดงวิธีคิดเมื่อมีการคำนวณ',objectives:['อธิบายและประยุกต์ใช้ความรู้ในหัวข้อที่กำหนดได้','วิเคราะห์และแก้ปัญหาทางวิชาชีพอย่างเป็นระบบได้']}
    };
    const mcq=[['ข้อใดอธิบายความสัมพันธ์ตามกฎของโอห์มได้ถูกต้อง','แรงดันเท่ากับกระแสคูณความต้านทาน','กระแสเท่ากับแรงดันคูณความต้านทาน','ความต้านทานเท่ากับกำลังหารกระแส','แรงดันไม่สัมพันธ์กับกระแส','ก'],['เมื่อแรงดันคงที่และความต้านทานเพิ่มขึ้น กระแสไฟฟ้าจะเป็นอย่างไร','เพิ่มขึ้น','ลดลง','คงที่','เป็นศูนย์เสมอ','ข'],['หน่วยของความต้านทานไฟฟ้าคือข้อใด','โวลต์','แอมแปร์','โอห์ม','วัตต์','ค'],['วงจรมีแรงดัน 12 V และความต้านทาน 6 Ω จะมีกระแสเท่าใด','0.5 A','2 A','6 A','72 A','ข']];
    function qData(i,type,topic){const waiting=['รอสร้างจากเนื้อหาที่เลือก','เพิ่มหรือเลือกเนื้อหาด้านซ้าย','กดปุ่ม “สร้างจากเนื้อหาที่เลือก”','ระบบจะไม่ใช้โจทย์ตัวอย่างข้ามหัวข้อ','ตรวจส่วนที่ไฮไลต์ใต้เนื้อหาก่อนสร้าง','ยังไม่สร้างข้อสอบ'];if(type.includes('ปรนัย'))return waiting;if(type==='เติมคำ')return [`กรุณาเพิ่มเนื้อหาก่อนสร้างใบงานเรื่อง ${topic}`,null,null,null,null,'ระบบจะแสดงช่องเติมคำจากข้อความที่เลือก'];if(type==='ถาม–ตอบ')return [`กรุณาเพิ่มเนื้อหาก่อนสร้างใบงานเรื่อง ${topic}`,null,null,null,null,'ระบบจะแสดงคำถามจากข้อความที่เลือก'];if(type==='คำนวณ')return [`กรุณาเพิ่มเนื้อหาที่มีข้อมูลคำนวณก่อนสร้างใบงานเรื่อง ${topic}`,null,null,null,null,'ระบบจะไม่สร้างโจทย์คำนวณเองหากไม่มีข้อมูลในเนื้อหา'];if(type==='ใบงานปฏิบัติ')return [`กรุณาเพิ่มเนื้อหาก่อนสร้างใบงานเรื่อง ${topic}`,null,null,null,null,'ระบบจะสร้างขั้นปฏิบัติจากเนื้อหาที่เลือก'];if(type==='วิเคราะห์')return [`กรุณาเพิ่มเนื้อหาก่อนสร้างใบงานเรื่อง ${topic}`,null,null,null,null,'ระบบจะสร้างคำถามวิเคราะห์จากเนื้อหาที่เลือก'];if(type==='แบบผสม')return waiting;return [`กรุณาเพิ่มเนื้อหาก่อนสร้างใบงานเรื่อง ${topic}`,null,null,null,null,'ระบบจะสร้างคำถามจากเนื้อหาที่เลือก'];}
    function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
    function render(){const v=Object.fromEntries(fields.map(id=>[id,$(id).value.trim()]));v.count=Math.max(1,Math.min(60,Number(v.count)||1));$('count').value=v.count;const p=presets[v.type];let qs='';for(let i=0;i<v.count;i++){const q=qData(i,v.type,v.topic);const choices=q[1]?`<div class="choices"><span>ก. ${q[1]}</span><span>ข. ${q[2]}</span><span>ค. ${q[3]}</span><span>ง. ${q[4]}</span></div>`:(v.type==='ถาม–ตอบ'?'<div class="answer-inline"><b>ตอบ:</b><span></span></div>':v.type==='เติมคำ'?'':'<div class="answer-lines"><span>................................................................................................</span></div>');qs+=`<li>${esc(q[0])}${choices}<div class="answer"><b>เฉลย:</b> ${esc(q[5])}</div></li>`}
      $('paper').innerHTML=`<div class="teacher-badge">เอกสารสำหรับครู • มีแนวคำตอบกำกับทุกข้อ</div><header class="doc-header"><div class="crest">⚡</div><div class="doc-title"><h1>${esc(v.school)}</h1><p>แผนกวิชา${esc(v.department)} • ใบงานรายวิชา</p></div><div class="doc-no">ใบงานที่<br><b>01</b></div></header><div class="student-line"><span>ชื่อ–สกุล <i class="blank"></i></span><span>ชั้น ${esc(v.level)} ${esc(v.year)} / <i class="blank" style="min-width:32px"></i></span><span>เลขที่ <i class="blank" style="min-width:35px"></i></span></div><section class="doc-meta"><h2>${esc(v.topic)}</h2><p><b>วิชา:</b> ${esc(v.subject)} &nbsp; <b>รหัส:</b> ${esc(v.code)} &nbsp; <b>ระดับ:</b> ${esc(v.level)} ชั้นปีที่ ${esc(v.year)}</p><p><b>ประเภท:</b> ${esc(v.type)} &nbsp; <b>ระดับความยาก:</b> ${esc(v.difficulty)}</p></section><section class="block"><h3>คำชี้แจง</h3><p>${p.instruction} จำนวน ${v.count} ข้อ คะแนนเต็ม ${v.count} คะแนน</p></section><section class="block"><h3>ความรู้เบื้องต้น</h3><p>${esc(v.topic)} เป็นเนื้อหาสำคัญที่ผู้เรียนควรเข้าใจทั้งหลักการ คำศัพท์ และการประยุกต์ใช้ในงานอาชีพ ควรพิจารณาข้อมูลที่โจทย์กำหนด เลือกหลักการที่เหมาะสม และตรวจสอบคำตอบทุกครั้ง</p></section><section class="block"><h3>แบบฝึกหัด</h3><ol class="exercise">${qs}</ol></section><div class="scorebox">คะแนนที่ได้ ______ / ${v.count} คะแนน<br>ผู้ตรวจ __________________</div>`;localStorage.setItem('vocWorksheetDraft',JSON.stringify(v));}
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('paper').classList.toggle('teacher',t.dataset.view==='teacher')});
    $('generateBtn').onclick=render;$('printBtn').onclick=()=>window.print();$('resetBtn').onclick=()=>{if(confirm('ต้องการล้างข้อมูลและกลับค่าเริ่มต้นหรือไม่?')){localStorage.removeItem('vocWorksheetDraft');location.reload()}};
    fields.forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(window.rt);window.rt=setTimeout(()=>window.render(),180)}));try{const d=JSON.parse(localStorage.getItem('vocWorksheetDraft'));if(d)fields.forEach(id=>{if(d[id]!=null)$(id).value=d[id]})}catch(e){}render();
  </script>
