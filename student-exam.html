<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>ระบบทำข้อสอบออนไลน์</title><style>
:root{--ink:#16324f;--blue:#0f6097;--bg:#eef4f8}*{box-sizing:border-box}body{margin:0;font-family:"Sarabun",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e2ebf2;border-radius:18px;padding:20px;box-shadow:0 12px 35px #16344712;margin:14px 0}h1,h2{margin-top:0}.muted{color:#64748b}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input{width:100%;border:1px solid #cfdce6;border-radius:10px;padding:11px}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.full{width:100%}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:20;background:#073b5f;color:#fff}.topin{max-width:820px;margin:auto;padding:11px 18px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}.pill{background:#ffffff18;border:1px solid #ffffff2e;border-radius:999px;padding:5px 9px;font-size:.82rem}.timer{font-size:1.2rem;font-weight:900}.q{font-size:1.05rem;font-weight:800;line-height:1.5}.choice{display:flex;gap:9px;align-items:flex-start;border:1px solid #d3e0e8;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.choice:has(input:checked){border-color:#0f6097;background:#eff8fd}.choice input{margin-top:4px}.warn{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:12px;padding:11px;margin-top:12px}.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:12px;padding:11px}.progress{height:8px;background:#dbe4ec;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:#0f6097;width:0}.submitbar{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(transparent,var(--bg) 35%)}</style></head><body>
<header class="topbar hidden" id="topbar"><div class="topin"><div class="title" id="titleTop">ข้อสอบ</div><div class="timer" id="timer">--:--</div><div class="stats"><span class="pill" id="answeredStat">ตอบ 0/0</span><span class="pill" id="leaveStat">ออกจากหน้า 0 ครั้ง</span></div></div></header>
<main class="wrap"><section class="card" id="startCard"><h1>ระบบทำข้อสอบออนไลน์</h1><p id="examInfo" class="muted">กำลังโหลดข้อมูลข้อสอบ...</p><div id="loadError" class="warn hidden"></div><div id="loginFields" class="hidden"><div class="field"><label>ชื่อ–นามสกุล</label><input id="studentName" maxlength="100" autocomplete="name"></div><div class="field"><label>รหัสนักเรียน / นักศึกษา</label><input id="studentId" maxlength="30" autocomplete="off"></div><div class="warn">เมื่อเริ่มสอบ ระบบจะจับเวลาและบันทึกเมื่อออกจากหน้าสอบหรือสลับแอป หากครบจำนวนที่ครูกำหนด ระบบจะส่งข้อสอบอัตโนมัติ</div><button class="btn full" id="startBtn" style="margin-top:14px">เริ่มสอบ</button></div></section><section id="examArea" class="hidden"><div class="progress"><div id="progressBar"></div></div><div id="questionList"></div><div class="submitbar"><button class="btn full" id="submitBtn">ส่งข้อสอบ</button></div></section><section class="card hidden" id="doneCard"><h2>ส่งข้อสอบแล้ว</h2><div id="doneText" class="ok"></div></section></main>
<script>
const EXAM_API_URL='https://script.google.com/macros/s/AKfycbxunyrg12A_Fv4fM-6GZZ4rVXz07-EN_rRGsTbBQZmsLcjFnLeLgNX3t-vyHH8d7Xfqgw/exec',examId=new URLSearchParams(location.search).get('exam');let exam=null,attemptId='',endServerMs=0,timerId=null,started=false,submitting=false,leaveCount=0,lastLeaveAt=0;const answers={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function api(p){const r=await fetch(EXAM_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});if(!r.ok)throw Error('เชื่อมต่อระบบไม่ได้');const j=await r.json();if(!j.ok)throw Error(j.error||'เกิดข้อผิดพลาด');return j}
async function loadExam(){try{if(EXAM_API_URL.includes('PUT_YOUR'))throw Error('ระบบยังไม่ได้ตั้งค่า API');if(!examId)throw Error('ลิงก์ไม่มีรหัสข้อสอบ');const d=await api({action:'getExam',examId});exam=d.exam;$('examInfo').textContent=`${exam.title} • ${exam.questions.length} ข้อ • ${exam.duration} นาที`;$('loginFields').classList.remove('hidden')}catch(e){$('loadError').textContent=e.message;$('loadError').classList.remove('hidden')}}
$('startBtn').onclick=async()=>{if(!exam||started)return;const studentName=$('studentName').value.trim(),studentId=$('studentId').value.trim();if(!studentName||!studentId){alert('กรุณากรอกชื่อและรหัสนักเรียน');return}$('startBtn').disabled=true;try{const d=await api({action:'startAttempt',examId,studentName,studentId});attemptId=d.attemptId;endServerMs=d.endMs;try{await document.documentElement.requestFullscreen?.()}catch(_){}started=true;$('startCard').classList.add('hidden');$('examArea').classList.remove('hidden');$('topbar').classList.remove('hidden');$('titleTop').textContent=exam.title;render();stats();tick();timerId=setInterval(tick,1000)}catch(e){alert(e.message);$('startBtn').disabled=false}};
function render(){$('questionList').innerHTML=exam.questions.map((q,i)=>`<article class="card"><div class="q">${i+1}. ${esc(q.q)}</div>${['ก','ข','ค','ง'].map(k=>`<label class="choice"><input type="radio" name="q${i}" value="${k}" data-q="${i}"><span><b>${k}.</b> ${esc(q.choices[k])}</span></label>`).join('')}</article>`).join('');document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=e=>{answers[e.target.dataset.q]=e.target.value;stats()})}
function stats(){const n=Object.keys(answers).length,t=exam?.questions.length||0;$('answeredStat').textContent=`ตอบ ${n}/${t}`;$('leaveStat').textContent=`ออกจากหน้า ${leaveCount} ครั้ง`;$('progressBar').style.width=(t?Math.round(n*100/t):0)+'%'}
function tick(){const left=Math.max(0,endServerMs-Date.now()),s=Math.ceil(left/1000),m=Math.floor(s/60),ss=s%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');if(left<=0)submitExam(true,'หมดเวลา')}
async function leave(reason){if(!started||submitting)return;const n=Date.now();if(n-lastLeaveAt<1500)return;lastLeaveAt=n;leaveCount++;stats();api({action:'logEvent',examId,attemptId,event:reason,leaveCount}).catch(()=>{});if(leaveCount>=exam.maxLeave)await submitExam(true,'ออกจากหน้าสอบครบจำนวนที่กำหนด');else alert(`ตรวจพบการออกจากหน้าสอบ ครั้งที่ ${leaveCount}/${exam.maxLeave}`)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)leave('hidden')});window.addEventListener('blur',()=>leave('blur'));document.addEventListener('fullscreenchange',()=>{if(started&&!document.fullscreenElement)leave('exit_fullscreen')});$('submitBtn').onclick=()=>submitExam(false,'ส่งด้วยตนเอง');
async function submitExam(auto,reason){if(!started||submitting)return;if(!auto&&!confirm(`ยืนยันส่งข้อสอบ? ตอบแล้ว ${Object.keys(answers).length}/${exam.questions.length} ข้อ`))return;submitting=true;clearInterval(timerId);$('submitBtn').disabled=true;try{const d=await api({action:'submitAttempt',examId,attemptId,answers,leaveCount,reason});started=false;$('examArea').classList.add('hidden');$('topbar').classList.add('hidden');$('doneCard').classList.remove('hidden');$('doneText').textContent=d.showScore?`บันทึกเรียบร้อย คะแนน ${d.score}/${d.total}`:'บันทึกคำตอบเรียบร้อย';try{if(document.fullscreenElement)await document.exitFullscreen()}catch(_){}}catch(e){submitting=false;$('submitBtn').disabled=false;alert('ส่งไม่สำเร็จ: '+e.message)}}window.addEventListener('beforeunload',e=>{if(started&&!submitting){e.preventDefault();e.returnValue=''}});loadExam();
</script></body></html>
